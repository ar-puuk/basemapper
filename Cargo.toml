[workspace]
members = ["core", "py-basemapper"]
resolver = "2"

[workspace.dependencies]
tokio        = { version = "1",    features = ["full"] }
reqwest      = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
prost        = "0.13"
image        = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
once_cell    = "1"
log          = "0.4"
pollster     = "0.3"

# Pin ar-puuk's fork at the verified commit. No source changes were needed —
# all required APIs (copy_texture, map_async, buffer, bytes_per_row, unmap)
# are already pub in this revision.
[patch."https://github.com/ar-puuk/maplibre-rs"]
maplibre = { path = "../maplibre-rs/maplibre" }
