# Great Docs Configuration
# https://posit-dev.github.io/great-docs/user-guide/configuration.html

display_name: basemapper

# GitHub-only distribution for now: no package-index link.
pypi: false

parser: google

# Freeze: great-docs' default (auto). A local build reuses a guide page's
# results until its .qmd changes, kept in _freeze/, which is git-ignored;
# CI starts without it, so the published site always runs every page.

dynamic: true

site_url: "https://ar-puuk.github.io/basemapper/python/"

site:
  theme: cosmo

# The navbar shows the mark (the hex logo's map plates) with the name; the
# hex logo itself (logo.svg) is the README's.
logo:
  light: mark.svg
  dark: mark.svg
  show_title: true

favicon: favicon.svg

# The README opens with the logo and title; a hero would repeat them.
hero: false

accent_color: "#007EA7"
navbar_color: "#0E171E"

github_style: icon

skill:
  enabled: false

include_in_header:
  - text: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
      body, p, li, td, th, .navbar, .sidebar { font-family: 'Inter', sans-serif !important; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Inter', sans-serif !important; }
      code, pre, tt, kbd { font-family: 'JetBrains Mono', monospace !important; }
      body:not(.quarto-dark) pre, body:not(.quarto-dark) :not(pre) > code { background-color: #E8F4F8 !important; }
      /* The name beside the navbar mark, as plain text (great-docs boxes it). */
      .navbar .navbar-title { border: 0 !important; padding: 0 !important; font-size: 1.15rem; }
      .navbar .navbar-brand-logo { margin-right: 0.15rem; }
      a:not(.navbar-brand):not(.nav-link):not(.btn) { color: #007EA7; }
      a:not(.navbar-brand):not(.nav-link):not(.btn):hover { color: #D96E34; }
      .cell-output-display img, main table img { max-width: 100%; height: auto; border-radius: 6px; }
      .bm-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin: 1rem 0 1.5rem; }
      .bm-cell { margin: 0; }
      .bm-cell img { width: 100%; height: auto; border-radius: 6px; display: block; }
      .bm-cell figcaption { font-size: 0.85rem; margin-top: 4px; display: flex; justify-content: space-between; gap: 6px; }
      .bm-cell figcaption span { opacity: 0.65; }
      </style>

reference:
  - title: Basemap views
    desc: >
      Create a view (`basemap()`), change it (`set_view`, `set_bounds`), read
      it (`get_bounds`, `get_center`, `get_zoom`, `get_size`) and render it
      (`render_png`, `render_svg`, `render_array`). The same functions and
      arguments exist in R.
    contents:
      - basemap
      - Basemap

  - title: One-shot rendering
    desc: Render bounds to an RGBA array in one call.
    contents:
      - render_basemap_raw

  - title: Plot integrations
    desc: >
      Drop a basemap layer into an existing plot, rendered at the output
      resolution. `geom_basemap` takes the same arguments in plotnine and
      ggplot2 (R).
    contents:
      - add_basemap
      - geom_basemap

  - title: Styles
    desc: >
      Named basemaps (leaflet-providers names, usable as `style`), styles
      for your own tile data, and OGC services. Tile
      data (tile URLs, TileJSON, PMTiles, ArcGIS services) also works as
      `style` directly.
    contents:
      - basemap_provider
      - list_providers
      - providers
      - tile_style
      - wms_style
      - wmts_style

  - title: Style layers and attribution
    desc: >
      A style's layers with their features, for the `layers` and `features`
      filters, and the attribution text it asks maps to show.
    contents:
      - list_layers
      - get_attribution

  - title: Tile cache
    contents:
      - tile_cache

  - title: Exceptions
    contents:
      - BasemapError
      - ValidationError
      - StyleError
      - NetworkError

jupyter: python3
