# Great Docs Configuration
# https://posit-dev.github.io/great-docs/user-guide/configuration.html

display_name: basemapper

# GitHub-only distribution for now: no package-index link.
pypi: false

parser: google

# Freeze: great-docs' default (auto). A local build reuses a guide page's
# results until its .qmd changes, kept in _freeze/, which is git-ignored;
# CI starts without it, so the published site always runs every page.

dynamic: true

site_url: "https://ar-puuk.github.io/basemapper/python/"

site:
  theme: cosmo

# The navbar shows the mark (the hex logo's map plates) with the name; the
# hex logo itself (logo.svg) is the README's.
logo:
  light: mark.svg
  dark: mark.svg
  show_title: true

favicon: favicon.svg

# The README opens with the logo and title; a hero would repeat them.
hero: false

accent_color: "#007EA7"
navbar_color: "#0E171E"

github_style: icon

skill:
  enabled: false

include_in_header:
  - text: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
      body, p, li, td, th, .navbar, .sidebar { font-family: 'Inter', sans-serif !important; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Inter', sans-serif !important; }
      code, pre, tt, kbd { font-family: 'JetBrains Mono', monospace !important; }
      body:not(.quarto-dark) pre, body:not(.quarto-dark) :not(pre) > code { background-color: #E8F4F8 !important; }
      /* The name beside the navbar mark, as plain text (great-docs boxes it). */
      .navbar .navbar-title { border: 0 !important; padding: 0 !important; font-size: 1.15rem; }
      .navbar .navbar-brand-logo { margin-right: 0.15rem; }
      a:not(.navbar-brand):not(.nav-link):not(.btn) { color: #007EA7; }
      a:not(.navbar-brand):not(.nav-link):not(.btn):hover { color: #D96E34; }
      .cell-output-display img, main table img { max-width: 100%; height: auto; border-radius: 6px; }
      .bm-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin: 1rem 0 1.5rem; }
      .bm-cell { margin: 0; }
      .bm-cell img { width: 100%; height: auto; border-radius: 6px; display: block; }
      .bm-cell figcaption { font-size: 0.85rem; margin-top: 4px; display: flex; justify-content: space-between; gap: 6px; }
      .bm-cell figcaption span { opacity: 0.65; }
      .bm-knobs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: end; margin: 1rem 0 1.5rem; }
      @media (max-width: 640px) { .bm-knobs { grid-template-columns: 1fr; } }
      .bm-knob { margin: 0; display: grid; gap: 6px; justify-items: center; text-align: center; }
      .bm-knob img { width: 100%; height: auto; border-radius: 4px; border: 1px solid rgba(127, 127, 127, 0.3); display: block; }
      .bm-knob img.bm-pixels { image-rendering: pixelated; }
      .bm-knob figcaption { display: grid; gap: 4px; justify-items: center; font-size: 0.85rem; }
      .bm-chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
      .bm-chip { font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(127, 127, 127, 0.4); opacity: 0.75; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .bm-chip.hot { opacity: 1; border-color: #D96E34; background: rgba(217, 110, 52, 0.15); }
      .bm-credit { font-size: 0.8rem; opacity: 0.7; }
      </style>

reference:
  - title: Basemaps
    desc: >
      A basemap is styles plus what you know of the view: any three of
      extent, zoom, printed size and symbol scale give the fourth, and the
      dpi is the sharpness. `set_view()` and
      `set_bounds()` return a new one; its properties read the view. The
      same functions and arguments exist in R and Rust.
    contents:
      - basemap
      - Basemap
      - around
      - outside

  - title: Renderings
    desc: >
      `Basemap.render()` draws a basemap once; the rendering knows where it
      is and converts to PNG, NumPy and xarray. Its notes say what was
      decided, adjusted or missing.
    contents:
      - Rendering
      - Note

  - title: Plots
    desc: >
      A basemap in a matplotlib or plotnine plot, warped into the plot's CRS
      and rendered at the output resolution: `m.add_to(ax)`,
      `ggplot(df) + m`. `zoom_for()` plans a zoom; `last_rendering()` reads
      what a drawn plot used.
    contents:
      - add_basemap
      - geom_basemap
      - zoom_for
      - last_rendering

  - title: Styles
    desc: >
      What to draw: `style()` with its filters and key, and the source
      helpers `provider()`, `tiles()`, `wms()` and `wmts()`. A catalogue
      name, MapLibre style or tile data also works as a style directly.
    contents:
      - style
      - Style
      - Source
      - provider
      - tiles
      - wms
      - wmts
      - list_providers
      - providers
      - list_layers
      - get_attribution

  - title: Downloads
    desc: How tiles download (`FetchOptions`, the `fetch` argument) and the tile cache.
    contents:
      - FetchOptions
      - tile_cache

  - title: Exceptions and warnings
    contents:
      - BasemapError
      - ValidationError
      - StyleError
      - NetworkError
      - BasemapWarning
      - BasemapAdjustment
      - BasemapProblem

jupyter: python3
