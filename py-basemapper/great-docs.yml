# Great Docs Configuration
# https://posit-dev.github.io/great-docs/user-guide/configuration.html

parser: google
dynamic: true

site_url: "https://ar-puuk.github.io/basemapper/python/"

site:
  theme: cosmo

logo: logo.svg

accent_color: "#007EA7"
navbar_color: "#0E171E"

skill:
  enabled: false

include_in_header:
  - text: |
      <script>
      (function(){
        function addLink(){
          var nav=document.querySelector('.navbar-nav');
          if(!nav||document.getElementById('r-docs-nav-link'))return;
          var li=document.createElement('li');
          li.className='nav-item';
          var a=document.createElement('a');
          a.id='r-docs-nav-link';
          a.href='https://ar-puuk.github.io/basemapper/r/';
          a.className='nav-link';
          a.textContent='R docs';
          li.appendChild(a);
          nav.appendChild(li);
        }
        if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',addLink);}
        else{addLink();}
      })();
      </script>

reference:
  - title: Core rendering
    desc: Low-level tile fetch and composite.
    contents:
      - render_basemap_raw

  - title: Plot integrations
    desc: >
      Drop a basemap layer into an existing spatial plot.
      `geom_basemap` works in both ggplot2 (R) and plotnine (Python).
    contents:
      - add_basemap
      - geom_basemap

  - title: Layer utilities
    desc: Inspect and filter layers inside a MapLibre GL style.
    contents:
      - list_layers

  - title: Tile style helpers
    desc: Convert bare tile URLs to MapLibre GL Style JSON.
    contents:
      - RasterProvider
      - VectorProvider
      - EsriVectorProvider
      - EsriRasterProvider

  - title: Exceptions
    contents:
      - BasemapError

jupyter: python3
