      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
      body, p, li, td, th, .navbar, .sidebar { font-family: 'Inter', sans-serif !important; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Inter', sans-serif !important; }
      code, pre, tt, kbd { font-family: 'JetBrains Mono', monospace !important; }
      pre, :not(pre) > code { background-color: #E8F4F8 !important; }
      a:not(.navbar-brand):not(.nav-link):not(.btn) { color: #007EA7; }
      a:not(.navbar-brand):not(.nav-link):not(.btn):hover { color: #D96E34; }
      #r-docs-nav-link {
        margin-left: auto;
        align-self: stretch;
        display: flex !important;
        align-items: center;
        padding: 0 16px !important;
        margin-right: 8px;
        background-color: #007EA7;
        color: #fff !important;
        text-decoration: none !important;
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 6px;
        transition: background-color 0.15s ease;
      }
      #r-docs-nav-link:hover {
        background-color: #D96E34 !important;
        color: #fff !important;
      }
      </style>
  - text: |
      <script>
      (function(){
        function addLink(){
          var tools=document.querySelector('.quarto-navbar-tools');
          if(!tools||document.getElementById('r-docs-nav-link'))return;
          var a=document.createElement('a');
          a.id='r-docs-nav-link';
          a.href='../r/';
          a.textContent='R docs';
          tools.parentNode.appendChild(a);
        }
        if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',addLink);}
        else{addLink();}
      })();
      </script>

reference:
  - title: Basemap views
    desc: >
      Create a view (`basemap()`), change it (`set_view`, `set_bounds`), read
      it (`get_bounds`, `get_center`, `get_zoom`, `get_size`) and render it
      (`render_png`, `render_svg`, `render_array`). The same functions and
      arguments exist in R.
    contents:
      - basemap
      - Basemap

  - title: One-shot rendering
    desc: Render bounds to an RGBA array in one call.
    contents:
      - render_basemap_raw

  - title: Plot integrations
    desc: >
      Drop a basemap layer into an existing plot, rendered at the output
      resolution. `geom_basemap` takes the same arguments in plotnine and
      ggplot2 (R).
    contents:
      - add_basemap
      - geom_basemap

  - title: Styles
    desc: Styles for named basemaps and common tile services.
    contents:
      - basemap_provider
      - list_providers
      - raster_provider
      - vector_provider
      - esri_raster_provider
      - esri_vector_provider
      - wms_provider
      - wmts_provider
      - pmtiles_provider

  - title: Style layers
    desc: The layers of a style, for the `layers` filter.
    contents:
      - list_layers

  - title: Exceptions
    contents:
      - BasemapError
      - ValidationError
      - StyleError
      - NetworkError

jupyter: python3
