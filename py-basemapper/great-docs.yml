# Great Docs Configuration
# https://posit-dev.github.io/great-docs/user-guide/configuration.html

parser: google
dynamic: true

site_url: "https://ar-puuk.github.io/basemapper/python/"

site:
  theme: cosmo

logo: logo.svg

accent_color: "#007EA7"
navbar_color: "#0E171E"

skill:
  enabled: false

mcp:
  enabled: false

include_in_header:
  - text: |
      <style>
      .bm-banner{text-align:center;padding:9px 20px;font-size:.95rem;border-bottom:2px solid rgba(0,0,0,.10);line-height:1.9;font-weight:500;letter-spacing:.01em;}
      .bm-banner-py{background:#FFF3E8;color:#2D1A00;}
      .bm-banner-py a{font-weight:700;text-decoration:underline;color:#D96E34;}
      </style>
      <script>
      document.addEventListener('DOMContentLoaded',function(){
        var b=document.createElement('div');
        b.className='bm-banner bm-banner-py';
        b.innerHTML='Python documentation — <a href="https://ar-puuk.github.io/basemapper/r/">Switch to R docs<\/a>';
        var nav=document.querySelector('nav.navbar');
        if(nav&&nav.parentNode){nav.parentNode.insertBefore(b,nav.nextSibling);}
        else{document.body.insertBefore(b,document.body.firstChild);}
      });
      </script>

reference:
  - title: Core rendering
    desc: Low-level tile fetch and composite.
    contents:
      - render_basemap_raw

  - title: Plot integrations
    desc: >
      Drop a basemap layer into an existing spatial plot.
      `geom_basemap` works in both ggplot2 (R) and plotnine (Python).
    contents:
      - add_basemap
      - geom_basemap

  - title: Layer utilities
    desc: Inspect and filter layers inside a MapLibre GL style.
    contents:
      - list_layers

  - title: Tile style helpers
    desc: Convert bare tile URLs to MapLibre GL Style JSON.
    contents:
      - RasterProvider
      - VectorProvider
      - EsriVectorProvider
      - EsriRasterProvider

  - title: Exceptions
    contents:
      - BasemapError

jupyter: python3
