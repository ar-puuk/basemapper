[package]
name    = "py-basemapper"
version = "0.1.0"
edition = "2021"

[lib]
name    = "_basemapper"
crate-type = ["cdylib"]

[dependencies]
basemapper-core = { path = "../core" }
pyo3            = { version = "0.22", features = ["extension-module", "abi3-py39"] }
tokio           = { workspace = true }
