[build-system]
requires      = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name        = "basemapper"
version     = "0.4.0"
description = "Headless spatial basemap renderer for Python"
requires-python = ">=3.9"
license     = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "pyproj>=3.3",
]

[project.optional-dependencies]
# Plot integrations: add_basemap() (matplotlib), geom_basemap() (plotnine).
matplotlib = ["matplotlib>=3.5", "xarray>=2022.06"]
plotnine = ["plotnine>=0.12", "matplotlib>=3.5", "xarray>=2022.06"]
all = ["plotnine>=0.12", "matplotlib>=3.5", "xarray>=2022.06"]
dev      = [
    "great-docs",
    # The user guide's examples (executed when the docs are built)
    "ipykernel",
    "geopandas",
    "geodatasets",
    "pytest>=7",
    "plotnine>=0.12",
    "matplotlib>=3.5",
    "xarray>=2022.06",
    "rasterio",
]

[tool.maturin]
module-name     = "basemapper._basemapper"
python-packages = ["basemapper"]
python-source   = "src"
features        = ["pyo3/extension-module"]

# great-docs is configured via py-basemapper/great-docs.yml (CLI config file).
# The [tool.great-docs] section is retained only as a reference; the CLI
# reads great-docs.yml and ignores this table.
[tool.great-docs]
source  = "src/basemapper"
style   = "google"
