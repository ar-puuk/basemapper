[build-system]
requires      = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name        = "basemapper"
version     = "0.1.0"
description = "Headless spatial basemap renderer for Python"
requires-python = ">=3.9"
license     = { text = "MIT" }
dependencies = [
    "numpy>=1.21",
    "pyproj>=3.3",
    "matplotlib>=3.5",
    "requests>=2.28",
]

[project.optional-dependencies]
plotnine = ["plotnine>=0.12"]
dev      = [
    "great-docs",
    "pytest>=7",
    "responses>=0.23",
    "plotnine>=0.12",
]

[tool.maturin]
module-name     = "basemapper._basemapper"
python-packages = ["basemapper"]
python-source   = "src"
features        = ["pyo3/extension-module"]

# great-docs is configured via py-basemapper/great-docs.yml (CLI config file).
# The [tool.great-docs] section is retained only as a reference; the CLI
# reads great-docs.yml and ignores this table.
[tool.great-docs]
source  = "src/basemapper"
style   = "google"
