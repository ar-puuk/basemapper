[package]
name    = "basemapper-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pmtiles     = { version = "0.23.0", default-features = false, features = ["__async"] }
lru         = "0.12"
# In-house CPU vector renderer (core/src/vector/).
flate2      = "1"
csscolorparser = "0.7"
tokio       = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
prost       = { workspace = true }
image       = { workspace = true }
once_cell   = { workspace = true }
log         = { workspace = true }

[dev-dependencies]
httptest    = "0.15"
resvg       = "0.50"
tokio       = { workspace = true }
reqwest     = { workspace = true, features = ["blocking"] }

[[example]]
name = "headless_render"

[dev-dependencies.clap]
version  = "4"
features = ["derive"]
