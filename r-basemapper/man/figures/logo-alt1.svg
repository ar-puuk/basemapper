<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 268" width="232" height="268">
  <!--
    Isometric cube hex:
    The hexagon IS the cube silhouette. Three inner edges divide it into
    the three visible faces: satellite top, terrain left, vector right.

    Hex vertices (pointy-top):
      top        = (116,  4)
      upper-right= (220, 62)
      lower-right= (220,206)
      bottom     = (116,264)
      lower-left = ( 12,206)
      upper-left = ( 12, 62)
    Centre = (116,134)

    Top face   : (12,62) → (116,4) → (220,62) → (116,134)
    Left face  : (116,264) → (12,206) → (12,62) → (116,134)
    Right face : (220,62) → (220,206) → (116,264) → (116,134)
  -->

  <defs>
    <clipPath id="face-top">
      <polygon points="12,62 116,4 220,62 116,134"/>
    </clipPath>
    <clipPath id="face-left">
      <polygon points="116,264 12,206 12,62 116,134"/>
    </clipPath>
    <clipPath id="face-right">
      <polygon points="220,62 220,206 116,264 116,134"/>
    </clipPath>
  </defs>

  <!-- ── TOP FACE: satellite / aerial ────────────────────────────────── -->
  <g clip-path="url(#face-top)">
    <!-- base field -->
    <rect x="0" y="0" width="232" height="134" fill="#3d5c2a"/>
    <!-- irregular field patches -->
    <polygon points="30,62 90,38 130,44 150,80 100,92 50,84"  fill="#4e7a3a"/>
    <polygon points="130,44 195,56 220,80 175,98 135,88"      fill="#5c7030"/>
    <polygon points="12,80  55,88 70,120 30,130 12,110"       fill="#2e4a22"/>
    <polygon points="70,120 130,100 165,120 150,134 90,134"   fill="#638040"/>
    <polygon points="155,65 195,56 220,62 220,100 180,108 155,86" fill="#4a6030"/>
    <!-- small water body -->
    <polygon points="85,52 110,48 118,64 95,72 78,66"         fill="#2255a0"/>
    <polygon points="95,72 118,64 122,82 102,86"              fill="#1e4a90"/>
  </g>

  <!-- ── LEFT FACE: raster / topographic elevation ───────────────────── -->
  <g clip-path="url(#face-left)">
    <rect x="0" y="62" width="116" height="202" fill="#0d2a50"/>
    <!-- horizontal elevation bands that follow the face's slope -->
    <polygon points="12,62  116,134  116,148  12, 76" fill="#103260"/>
    <polygon points="12, 76 116,148  116,162  12, 90" fill="#133a72"/>
    <polygon points="12, 90 116,162  116,176  12,104" fill="#164480"/>
    <polygon points="12,104 116,176  116,190  12,118" fill="#194e8e"/>
    <polygon points="12,118 116,190  116,204  12,132" fill="#1c589a"/>
    <polygon points="12,132 116,204  116,218  12,146" fill="#1f62a6"/>
    <polygon points="12,146 116,218  116,232  12,160" fill="#226cb2"/>
    <polygon points="12,160 116,232  116,246  12,174" fill="#2576bc"/>
    <polygon points="12,174 116,246  116,264  12,206" fill="#2880c8"/>
    <!-- subtle contour tick marks -->
    <line x1="12" y1=" 82" x2="116" y2="154" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <line x1="12" y1="106" x2="116" y2="178" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <line x1="12" y1="130" x2="116" y2="202" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <line x1="12" y1="154" x2="116" y2="226" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  </g>

  <!-- ── RIGHT FACE: vector / road map ───────────────────────────────── -->
  <g clip-path="url(#face-right)">
    <rect x="116" y="62" width="104" height="202" fill="#0f0f28"/>
    <!-- arterial roads (blue) -->
    <line x1="116" y1="134" x2="220" y2=" 90" stroke="#4a90d9" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="116" y1="168" x2="220" y2="124" stroke="#4a90d9" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="116" y1="210" x2="220" y2="166" stroke="#4a90d9" stroke-width="1.8" stroke-linecap="round"/>
    <!-- local roads (white) -->
    <line x1="116" y1="152" x2="220" y2="108" stroke="#e8e8e8" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="116" y1="187" x2="220" y2="143" stroke="#e8e8e8" stroke-width="1.4" stroke-linecap="round"/>
    <!-- cross streets (vertical, skewed to follow face) -->
    <line x1="148" y1=" 96" x2="148" y2="192" stroke="#e8e8e8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="174" y1=" 82" x2="174" y2="180" stroke="#e8e8e8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="200" y1=" 70" x2="200" y2="168" stroke="#4a90d9" stroke-width="1.8" stroke-linecap="round"/>
    <!-- POI dot -->
    <circle cx="174" cy="132" r="5" fill="#ffcc44" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- ── Hex border + inner cube edges ───────────────────────────────── -->
  <!-- Outer hex = cube silhouette -->
  <polygon points="116,4 220,62 220,206 116,264 12,206 12,62"
           fill="none" stroke="#2266c4" stroke-width="5" stroke-linejoin="round"/>
  <!-- Three inner edges from centre -->
  <line x1="116" y1="134" x2="116" y2="  4" stroke="#2266c4" stroke-width="2.5"/>
  <line x1="116" y1="134" x2=" 12" y2=" 62" stroke="#2266c4" stroke-width="2.5"/>
  <line x1="116" y1="134" x2="220" y2=" 62" stroke="#2266c4" stroke-width="2.5"/>

  <!-- ── Label ─────────────────────────────────────────────────────────── -->
  <text x="116" y="248"
        font-family="Inter, system-ui, sans-serif"
        font-size="24" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="0.5"
        opacity="0.92">basemapper</text>
</svg>
