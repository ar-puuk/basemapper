url: https://ar-puuk.github.io/basemapper/r/
destination: ../site/r

template:
  light-switch: true
  bootstrap: 5
  bslib:
    primary: "#007EA7"
    link-color: "#D96E34"
    navbar-bg: "#0E171E"
    base_font:
      google: "Inter"
    heading_font:
      google: "Inter"
    code_font:
      google: "JetBrains Mono"

home:
  title: R
  description: >
    Headless spatial basemap renderer for R.
    Fetches and composites styled map tiles into RGBA arrays,
    with ggplot2, tmap, and sf integration.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/ar-puuk/basemapper
      aria-label: GitHub

reference:
  - title: Package
    contents:
      - basemapper-package

  - title: Basemap views
    desc: >
      Create a view (`basemap()`), change it (`set_view()`, `set_bounds()`),
      read it (`get_bounds()`, `get_center()`, `get_zoom()`, `get_size()`)
      and render it (`render_png()`, `render_svg()`, `render_array()`,
      `render_raster()`). The same functions and arguments exist in Python.
    contents:
      - basemap
      - set_view
      - get_bounds
      - render_png
      - plot.basemap

  - title: One-shot rendering
    desc: Render bounds to a georeferenced RGBA array in one call.
    contents:
      - render_basemap_raw

  - title: Plot integrations
    desc: >
      Drop a basemap layer into an existing plot, rendered at the output
      resolution. `geom_basemap()` takes the same arguments in ggplot2 and
      plotnine (Python).
    contents:
      - geom_basemap
      - GeomBasemap
      - tm_basemap

  - title: Styles
    desc: >
      Named basemaps (leaflet-providers names, usable as `style`), styles
      for your own tile data, and OGC services. Tile
      data (tile URLs, TileJSON, PMTiles, ArcGIS services) also works as
      `style` directly.
    contents:
      - basemap_provider
      - list_providers
      - providers
      - tile_style
      - ogc_styles

  - title: Style layers and attribution
    desc: >
      A style's layers with their features, for the `layers` and `features`
      filters, and the attribution text it asks maps to show.
    contents:
      - list_layers
      - get_attribution

  - title: Tile cache
    contents:
      - tile_cache

  - title: Coordinate utilities
    desc: Internal helpers exposed for advanced use.
    contents:
      - reproject_bbox_to_3857
      - detect_crs_from_coord

articles:
  - title: Guides
    navbar: ~
    contents:
      - articles/getting-started
      - articles/gallery
      - articles/plotting
      - articles/layers
      - articles/own-data
