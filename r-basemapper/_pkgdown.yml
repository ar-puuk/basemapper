url: https://ar-puuk.github.io/basemapper/r/
destination: ../site/r

template:
  light-switch: true
  bootstrap: 5
  bslib:
    primary: "#007EA7"
    link-color: "#D96E34"
    navbar-bg: "#0E171E"
    base_font:
      google: "Inter"
    heading_font:
      google: "Inter"
    code_font:
      google: "JetBrains Mono"

home:
  title: R
  description: >
    Headless spatial basemap renderer for R.
    Fetches and composites styled map tiles into RGBA arrays,
    with ggplot2, tmap, and sf integration.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/ar-puuk/basemapper
      aria-label: GitHub

reference:
  - title: Package
    contents:
      - basemapper-package

  - title: Basemaps
    desc: >
      A basemap is styles plus what you know of the view: any three of
      extent, zoom, printed size and symbol scale give the fourth, and the
      dpi is the sharpness. Change the view with
      `set_view()` / `set_bounds()` and read it with `get_bounds()`,
      `get_center()`, `get_zoom()` and `get_size()`. The same functions and
      arguments exist in Python and Rust.
    contents:
      - basemap
      - set_view
      - get_bounds
      - around
      - outside

  - title: Renderings
    desc: >
      `render()` draws a basemap once; the rendering knows where it is and
      converts to PNG, arrays and terra rasters. `render_svg()` draws true
      vector SVG.
    contents:
      - render
      - rendering
      - plot.basemap

  - title: Plots
    desc: >
      A basemap in a ggplot2 or tmap plot, warped into the plot's CRS and
      rendered at the output resolution: `ggplot(df) + m`, `geom_basemap()`,
      `tm_basemap()`. `zoom_for()` plans a zoom; `last_rendering()` reads
      what a drawn plot used.
    contents:
      - geom_basemap
      - tm_basemap
      - zoom_for
      - last_rendering

  - title: Styles
    desc: >
      What to draw: `style()` with its filters and key, and the source
      helpers `provider()`, `tiles()`, `wms()` and `wmts()`. A catalogue
      name, MapLibre style or tile data also works as a style directly.
    contents:
      - style
      - sources
      - list_providers
      - providers
      - list_layers
      - get_attribution

  - title: Downloads and errors
    desc: >
      How tiles download (`fetch_options()`, the `fetch` argument), the tile
      cache, the classes of the errors basemapper raises, and the 0.2
      functions removed in 0.3.
    contents:
      - fetch_options
      - tile_cache
      - basemapper-errors
      - basemapper-defunct

articles:
  - title: Guides
    navbar: ~
    contents:
      - articles/getting-started
      - articles/gallery
      - articles/plotting
      - articles/sharpness
      - articles/layers
      - articles/own-data
