[package]
name    = "basemapper-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu        = { version = "22.1", features = ["wgsl"] }
# Canonical pin for CI / cargo-publish (no local [patch] override there).
# Local development redirects via [patch] in the root Cargo.toml to avoid a
# network fetch — see README.md for setup instructions.
# TODO: Replace with a crates.io release once maplibre-rs stabilises.
pmtiles     = { version = "0.23.0", default-features = false, features = ["http-async"] }
maplibre    = { git = "https://github.com/ar-puuk/maplibre-rs", rev = "3bb17231fc7895248bb3cd8a3882de472d74c12c", features = ["headless"] }
cgmath      = "0.18.0"
tokio       = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
prost       = { workspace = true }
image       = { workspace = true }
once_cell   = { workspace = true }
log         = { workspace = true }
pollster    = { workspace = true }

[dev-dependencies]
httptest    = "0.15"
tokio       = { workspace = true }

[[example]]
name = "headless_render"

[dev-dependencies.clap]
version  = "4"
features = ["derive"]
