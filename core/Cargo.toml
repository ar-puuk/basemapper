[package]
name    = "basemapper-core"
version = "0.2.0"
edition = "2021"

[dependencies]
pmtiles     = { version = "0.23.0", default-features = false, features = ["__async"] }
lru         = "0.18"
# PMTiles backend responses.
bytes       = "1"
# Disk tile cache: `Expires` headers.
httpdate    = "1"
# In-house CPU vector renderer (core/src/vector/).
flate2      = "1"
csscolorparser = "0.7"
# Right-to-left labels: UAX #9 reordering (as the RTL text plugin's ICU ubidi).
unicode-bidi = "0.3"
# SVG text: font lookup and subsetting for embedded fonts.
ttf-parser  = "0.25"
allsorts    = { version = "0.17", default-features = false, features = ["flate2_rust"] }
tokio       = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
prost       = { workspace = true }
image       = { workspace = true }
once_cell   = { workspace = true }
log         = { workspace = true }

[dev-dependencies]
httptest    = "0.15"
# Golden fixtures pack tile directories into PMTiles archives.
pmtiles     = { version = "0.23.0", default-features = false, features = ["__async", "write"] }
http        = "0.2"
hyper       = "0.14"
bytes       = "1"
resvg       = "0.50"
tokio       = { workspace = true }
reqwest     = { workspace = true, features = ["blocking"] }

[[example]]
name = "headless_render"

[dev-dependencies.clap]
version  = "4"
features = ["derive"]
