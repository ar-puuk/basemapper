name: Build and deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── R docs via pkgdown ──────────────────────────────────────────────────────
  build-r-docs:
    runs-on: ubuntu-latest
    # Prevent renv from auto-activating and hijacking the library path,
    # which causes pak to lose itself in its own subprocess.
    env:
      RENV_CONFIG_AUTOLOAD_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"))
          install.packages(c(
            "roxygen2", "pkgdown",
            "ggplot2", "sf", "jsonlite",
            "tmap", "stars",
            "knitr", "rmarkdown"
          ))

      - name: Build pkgdown site
        run: |
          Rscript -e "
            pkgdown::build_site(
              pkg         = 'r-basemapper',
              dest_dir    = '../site/r',
              preview     = FALSE,
              new_process = FALSE
            )
          "
        # roxygen2::roxygenize() is intentionally omitted: it tries to compile
        # the Rust extension (R CMD INSTALL), which fails without a Rust toolchain.
        # Man pages are pre-generated and committed; pkgdown reads them directly.

      - uses: actions/upload-artifact@v4
        with:
          name: r-docs
          path: site/r/

  # ── Python docs via great-docs ─────────────────────────────────────────────
  build-python-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and great-docs
        working-directory: py-basemapper
        run: pip install ".[dev]"

      - name: Build great-docs site
        working-directory: py-basemapper
        run: great-docs build
        # great-docs outputs to py-basemapper/great-docs/ by default.
        # The output directory is configured via great-docs.yml (site_url)
        # and is intentionally excluded from git via .gitignore.

      - uses: actions/upload-artifact@v4
        with:
          name: python-docs
          path: py-basemapper/great-docs/

  # ── Assemble, inject banners, deploy ───────────────────────────────────────
  deploy:
    needs: [build-r-docs, build-python-docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: r-docs
          path: site/r/

      - uses: actions/download-artifact@v4
        with:
          name: python-docs
          path: site/python/

      - name: Copy landing page
        run: cp docs/index.html site/index.html

      - name: Inject language banners
        run: python scripts/inject-lang-banner.py site/

      # To enable a custom domain: add a repository variable named CUSTOM_DOMAIN
      # (Settings → Secrets and variables → Variables) and uncomment below.
      # - name: Write CNAME
      #   if: ${{ vars.CUSTOM_DOMAIN != '' }}
      #   run: echo "${{ vars.CUSTOM_DOMAIN }}" > site/CNAME

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
