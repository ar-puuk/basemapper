name: Documentation

# Builds the whole documentation site (pkgdown, great-docs, rustdoc and the
# landing page) with scripts/build-docs.ps1 on Ubuntu, and deploys it to
# GitHub Pages from main. On dev and on pull requests it only builds, and
# uploads the site as an artifact (`site`) to inspect. site/ is not
# committed: this workflow is the only way the site is published.

on:
  push:
    branches: [main, dev]
    paths:
      - 'core/**'
      - 'r-basemapper/**'
      - 'py-basemapper/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'r-basemapper/**'
      - 'py-basemapper/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # r-basemapper/.Rprofile activates renv; setup-r-dependencies manages
      # the library here instead.
      RENV_ACTIVATE_PROJECT: "FALSE"
      NOT_CRAN: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      # The package (compiled from source: it needs Rust), what the articles
      # use, and the docs tools.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-basemapper
          extra-packages: |
            any::pkgdown
            any::roxygen2
            any::tmap
            any::png
            local::.
          needs: website

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py-basemapper/pyproject.toml
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build the site
        shell: pwsh
        run: ./scripts/build-docs.ps1

      - name: Upload the site to inspect
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7

      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
