name: Build documentation

# Builds the whole documentation site (pkgdown, great-docs, rustdoc and the
# landing page) with scripts/build-docs.ps1, as the docs are built locally,
# and uploads it as an artifact to inspect. It does not deploy: Deploy
# documentation (docs.yml) still publishes the committed site/ from main,
# until this build is trusted to replace it.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'core/**'
      - 'r-basemapper/**'
      - 'py-basemapper/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/docs-build.yml'

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # r-basemapper/.Rprofile activates renv; setup-r-dependencies manages
      # the library here instead.
      RENV_ACTIVATE_PROJECT: "FALSE"
      NOT_CRAN: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      # The package (compiled from source: it needs Rust), what the articles
      # use, and the docs tools.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-basemapper
          extra-packages: |
            any::pkgdown
            any::roxygen2
            any::tmap
            any::png
            local::.
          needs: website

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py-basemapper/pyproject.toml
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build the site
        shell: pwsh
        run: ./scripts/build-docs.ps1

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
