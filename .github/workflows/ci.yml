name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository: the token gets no write scopes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # R, Python and the Rust core share one version; a v* tag must name it.
      - name: Check the packages' versions (and the tag)
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python3 tools/version.py check --tag "${{ github.ref_name }}"
          else
            python3 tools/version.py check
          fi

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2


      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      # Bug-finding lints only (correctness, suspicious); style lints are
      # not enforced yet.
      - name: Clippy (correctness, suspicious)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked -- -A clippy::all -D clippy::correctness -D clippy::suspicious

      - name: Test core (unit, integration, golden images vs MapLibre GL JS)
        run: cargo test -p basemapper-core

      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-output-${{ matrix.os }}
          path: target/golden-output/
          if-no-files-found: ignore

  audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Both lockfiles: the workspace (core, Python wheel) and the R package.
      - name: cargo audit (workspace)
        run: cargo audit --file Cargo.lock
      - name: cargo audit (R package)
        run: cargo audit --file r-basemapper/Cargo.lock

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        working-directory: py-basemapper
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
          python -m pip install dist/*.whl pytest plotnine
      - name: pytest
        working-directory: py-basemapper
        run: python -m pytest -v

  r:
    name: R CMD check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: "false"
      # r-basemapper/.Rprofile auto-activates renv; let setup-r-dependencies
      # manage the library instead.
      RENV_ACTIVATE_PROJECT: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-basemapper
          extra-packages: any::rcmdcheck
          needs: check
      # Errors fail the job; warnings/notes (CRAN metadata cleanup is a
      # tracked follow-up) are reported but do not.
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-basemapper
          error-on: '"error"'
          args: 'c("--no-manual")'
