# GNU target: used for building r-basemapper via RTools45.
# The linker is the static-posix gcc from RTools45, which R sets RTOOLS45_HOME for.
# Library search paths are handled by libR-sys's build script and Makevars.win.
[target.x86_64-pc-windows-gnu]
linker = "C:\\rtools45\\x86_64-w64-mingw32.static.posix\\bin\\gcc.exe"

# maplibre-rs build.rs compiles glyphs.proto and needs the protoc binary.
# Installed via: winget install -e --id Google.Protobuf
[env]
PROTOC = "C:\\Users\\Pukar.Bhandari\\AppData\\Local\\Microsoft\\WinGet\\Packages\\Google.Protobuf_Microsoft.Winget.Source_8wekyb3d8bbwe\\bin\\protoc.exe"
